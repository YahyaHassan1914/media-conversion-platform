services:
  postgres:
    image: postgres:17
    container_name: job-database-postgres

    environment:
      POSTGRES_USER: jobapp
      POSTGRES_PASSWORD: jobapp_password
      POSTGRES_DB: jobsdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: